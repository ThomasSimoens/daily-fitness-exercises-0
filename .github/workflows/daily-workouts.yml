name: Schedule daily workouts

on:
  schedule:
    # 00:30 UTC = 01:30/02:30 in Belgium, so the UTC date matches the local date.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to schedule (YYYY-MM-DD, default: today UTC)"
        required: false

permissions:
  contents: write

concurrency:
  group: daily-workouts
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    env:
      CONTENT_KEY: ${{ secrets.CONTENT_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Decrypt user data
        run: npm run decrypt

      - name: Plan today's workouts
        id: plan
        run: node scripts/schedule-daily-workout.mjs ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Validate site builds
        if: steps.plan.outputs.changed == 'true'
        run: npm run build

      - name: Re-encrypt user data
        if: steps.plan.outputs.changed == 'true'
        run: npm run encrypt

      - name: Commit and push
        if: steps.plan.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/users/*.md.locked
          git commit -m "chore: schedule daily workouts"
          git pull --rebase
          git push
